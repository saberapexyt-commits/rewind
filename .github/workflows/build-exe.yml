name: Build Rewind.exe

# Runs when publish.py tags a new version (v1.0.0, v1.0.1, ...), or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # lets the workflow create the GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Rewind.exe
        shell: pwsh
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --hidden-import games --hidden-import overlay --hidden-import winmgr --onefile --noconsole --name Rewind --icon rewind.ico `
            --add-data "ui;ui" --add-data "rewind.ico;." --add-data "logo.png;." --add-data "repo.json;." `
            --hidden-import pystray._win32 --distpath dist/Rewind app.py

      - name: Get the pinned ffmpeg (for the smoke test only, it is not shipped)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/ffmpeg-n125875/ffmpeg-win64.zip" -OutFile ffmpeg.zip
          $want = "36c73f5526793f3d4fe06846cfbd42d34d9a6c117afe10f2056cfd8d35a05b64"
          $got = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "ffmpeg download doesn't match the pinned hash ($got)" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg

      - name: Smoke test (the pinned ffmpeg can see the screen capture and encoders)
        shell: pwsh
        run: |
          ffmpeg/ffmpeg.exe -hide_banner -filters | Select-String ddagrab
          ffmpeg/ffmpeg.exe -hide_banner -encoders | Select-String "nvenc|amf|qsv"
          ffmpeg/ffmpeg.exe -hide_banner -h filter=gfxcapture | Select-Object -First 5

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Rewind/Rewind.exe
          name: Rewind ${{ github.ref_name }}
          body_path: release-notes.md
